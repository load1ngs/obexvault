name: obexvault
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  otp: ^3.1.4
  mobile_scanner: ^5.2.3
  local_auth: ^2.3.0
  hive_ce: ^2.0.0
  hive_ce_flutter: ^2.0.0
  cryptography: ^2.7.0
  path_provider: ^2.1.4
  file_picker: ^8.1.2
  syncfusion_flutter_pdfviewer: ^27.1.48
  gal: ^2.3.0
  photo_manager: ^3.3.0
  http: ^1.2.1
  crypto: ^3.0.3
  firebase_storage: ^12.1.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#13131f"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/